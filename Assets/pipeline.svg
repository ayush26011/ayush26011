<svg viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg" width="900" height="120">
  <defs>
    <style>
      .node-label { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 700; fill: #a78bfa; }
      .arrow { stroke: #7c3aed; stroke-width: 2; fill: none; }
      .node-box {
        rx: 10; ry: 10;
        stroke: #a78bfa;
        stroke-width: 1.5;
        fill: #0d1117;
      }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="120" fill="#0d1117" rx="12"/>

  <!-- Grid lines for cyberpunk feel -->
  <line x1="0" y1="60" x2="900" y2="60" stroke="#1e1b4b" stroke-width="1" stroke-dasharray="4,8"/>

  <!-- Node boxes -->
  <rect x="20" y="35" width="130" height="50" rx="10" ry="10" fill="#0f0c29" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="195" y="35" width="130" height="50" rx="10" ry="10" fill="#0f0c29" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="370" y="35" width="130" height="50" rx="10" ry="10" fill="#0f0c29" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="545" y="35" width="130" height="50" rx="10" ry="10" fill="#0f0c29" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="720" y="35" width="130" height="50" rx="10" ry="10" fill="#0f0c29" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Node labels -->
  <text x="85" y="55" text-anchor="middle" class="node-label">🔬</text>
  <text x="85" y="75" text-anchor="middle" class="node-label">Research</text>

  <text x="260" y="55" text-anchor="middle" class="node-label">⚡</text>
  <text x="260" y="75" text-anchor="middle" class="node-label">Prototype</text>

  <text x="435" y="55" text-anchor="middle" class="node-label">⚙️</text>
  <text x="435" y="75" text-anchor="middle" class="node-label">Optimize</text>

  <text x="610" y="55" text-anchor="middle" class="node-label">📈</text>
  <text x="610" y="75" text-anchor="middle" class="node-label">Scale</text>

  <text x="785" y="55" text-anchor="middle" class="node-label">🚀</text>
  <text x="785" y="75" text-anchor="middle" class="node-label">Impact</text>

  <!-- Static connector lines -->
  <line x1="150" y1="60" x2="195" y2="60" stroke="#4c1d95" stroke-width="2"/>
  <polygon points="190,55 200,60 190,65" fill="#a78bfa"/>

  <line x1="325" y1="60" x2="370" y2="60" stroke="#4c1d95" stroke-width="2"/>
  <polygon points="365,55 375,60 365,65" fill="#a78bfa"/>

  <line x1="500" y1="60" x2="545" y2="60" stroke="#4c1d95" stroke-width="2"/>
  <polygon points="540,55 550,60 540,65" fill="#a78bfa"/>

  <line x1="675" y1="60" x2="720" y2="60" stroke="#4c1d95" stroke-width="2"/>
  <polygon points="715,55 725,60 715,65" fill="#a78bfa"/>

  <!-- ANIMATED traveling light pulse on connector 1 -->
  <circle r="5" fill="#a78bfa" filter="url(#glow)" opacity="0.9">
    <animateMotion dur="3s" repeatCount="indefinite" begin="0s">
      <mpath>
        <path d="M 150,60 L 850,60"/>
      </mpath>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="3s" repeatCount="indefinite" begin="0s"/>
  </circle>

  <!-- Second pulse staggered -->
  <circle r="3" fill="#c4b5fd" filter="url(#glow)" opacity="0.6">
    <animateMotion dur="3s" repeatCount="indefinite" begin="1.5s">
      <mpath>
        <path d="M 150,60 L 850,60"/>
      </mpath>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.05;0.95;1" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </circle>

  <!-- Pulsing glow on each node box -->
  <rect x="20" y="35" width="130" height="50" rx="10" ry="10" fill="none" stroke="#a78bfa" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0s"/>
  </rect>
  <rect x="195" y="35" width="130" height="50" rx="10" ry="10" fill="none" stroke="#a78bfa" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.4s"/>
  </rect>
  <rect x="370" y="35" width="130" height="50" rx="10" ry="10" fill="none" stroke="#a78bfa" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.8s"/>
  </rect>
  <rect x="545" y="35" width="130" height="50" rx="10" ry="10" fill="none" stroke="#a78bfa" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1.2s"/>
  </rect>
  <rect x="720" y="35" width="130" height="50" rx="10" ry="10" fill="none" stroke="#a78bfa" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1.6s"/>
  </rect>
</svg>
