<svg viewBox="0 0 900 80" xmlns="http://www.w3.org/2000/svg" width="900" height="80">
  <defs>
    <filter id="gR">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="resGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#0f0c29;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#0f0c29;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="900" height="80" fill="url(#resGrad)" rx="8"/>
  <!-- Border -->
  <rect x="2" y="2" width="896" height="76" rx="7" fill="none" stroke="#7c3aed" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Top accent line -->
  <rect x="2" y="2" width="896" height="3" rx="2" fill="#a78bfa" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- Accuracy meter -->
  <text x="30" y="28" font-family="'Fira Code', monospace" font-size="11" fill="#6b7280">ACCURACY</text>
  <rect x="30" y="35" width="200" height="10" rx="5" fill="#1e1b4b"/>
  <rect x="30" y="35" width="0" height="10" rx="5" fill="#a78bfa" filter="url(#gR)">
    <animate attributeName="width" from="0" to="187" dur="2s" repeatCount="1" fill="freeze"/>
  </rect>
  <text x="240" y="44" font-family="'Fira Code', monospace" font-size="11" fill="#a78bfa" font-weight="700">93.78%</text>

  <!-- Records label -->
  <text x="30" y="68" font-family="'Fira Code', monospace" font-size="10" fill="#6b7280">RECORDS ANALYZED: </text>
  <text x="175" y="68" font-family="'Fira Code', monospace" font-size="10" fill="#22c55e" font-weight="700">175,000+</text>

  <!-- Divider -->
  <line x1="310" y1="15" x2="310" y2="65" stroke="#1e1b4b" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#c4b5fd" filter="url(#gR)">📰 ELSEVIER PROCEDIA — AICCT 2025</text>
  <text x="450" y="52" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#8b5cf6">Multi-Class Anomaly Detection · Network Traffic · Supervised ML</text>
  <text x="450" y="68" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" fill="#4b5563">XGBoost · Ensemble Methods · 175K Records</text>

  <!-- Right glow dot cluster -->
  <circle cx="840" cy="30" r="6" fill="#a78bfa" opacity="0.7" filter="url(#gR)">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="30" r="4" fill="#7c3aed" opacity="0.5" filter="url(#gR)">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="875" cy="30" r="3" fill="#5b21b6" opacity="0.4" filter="url(#gR)">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <text x="858" y="60" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" fill="#4b5563">PUBLISHED</text>
  <circle cx="858" cy="70" r="3" fill="#22c55e" filter="url(#gR)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
