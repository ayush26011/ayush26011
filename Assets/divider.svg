<svg viewBox="0 0 900 40" xmlns="http://www.w3.org/2000/svg" width="900" height="40">
  <defs>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="40" fill="#0d1117"/>
  <!-- Base line -->
  <line x1="0" y1="20" x2="900" y2="20" stroke="#1e1b4b" stroke-width="1"/>
  <!-- Animated scan beam -->
  <rect height="40" fill="url(#scanGrad)" y="0" width="120">
    <animate attributeName="x" from="-120" to="900" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <defs>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#a78bfa;stop-opacity:0.15"/>
      <stop offset="60%" style="stop-color:#c4b5fd;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Neon center line -->
  <line x1="0" y1="20" x2="900" y2="20" stroke="#a78bfa" stroke-width="1" filter="url(#glow2)" opacity="0.5"/>
  <!-- Corner decorations -->
  <rect x="0" y="15" width="40" height="2" fill="#a78bfa" filter="url(#glow2)"/>
  <rect x="860" y="15" width="40" height="2" fill="#a78bfa" filter="url(#glow2)"/>
  <rect x="0" y="23" width="40" height="2" fill="#7c3aed" filter="url(#glow2)"/>
  <rect x="860" y="23" width="40" height="2" fill="#7c3aed" filter="url(#glow2)"/>
  <!-- Center diamond -->
  <polygon points="445,12 453,20 445,28 437,20" fill="#0d1117" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow2)">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="445,15 451,20 445,25 439,20" fill="#a78bfa" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" repeatCount="indefinite"/>
  </polygon>
</svg>
